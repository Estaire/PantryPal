app = 'pantrypal-app'
primary_region = 'dfw'

[build]
[env]
  DATABASE_URL = 'sqlite:////data/pantrypal.db'
  PORT = '8080'

[[mounts]]
  source = 'pantrypal_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
